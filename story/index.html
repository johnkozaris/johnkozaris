<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>John Kozaris: the story so far</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 1280px); aspect-ratio: 960 / 408; image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<canvas id="film" width="960" height="408"></canvas>
<script type="module">
  import { FILM, seek } from "./story.js";
  const canvas = document.getElementById("film");
  window.FILM = FILM;
  window.seek = (t) => seek(canvas, t);
  const params = new URLSearchParams(location.search);
  const still = params.get("t");
  if (still !== null) seek(canvas, Number(still));
  else {
    const t0 = performance.now();
    const loop = (now) => {
      seek(canvas, ((now - t0) / 1000) % FILM.DURATION);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
